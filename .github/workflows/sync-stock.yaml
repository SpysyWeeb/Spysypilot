name: sync stock branch with upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stock
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/commaai/openpilot.git
          git fetch upstream master

      - name: Fast-forward stock to upstream/master
        id: ff
        run: |
          if git merge --ff-only upstream/master; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.ff.outputs.result == 'success'
        id: push
        run: |
          if git push origin stock; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on divergence
        if: steps.ff.outputs.result == 'diverged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="stock branch has diverged from commaai/openpilot master"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Fast-forward sync failed on **stock** — it has commits upstream/master doesn't, which shouldn't happen on this branch. Investigate and resolve manually." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi

      - name: Notify on push failure
        if: steps.push.outputs.result == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] push blocked on stock — workflow file changed"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="The fast-forward from commaai/openpilot master was clean, but GitHub rejected the push because commaai touched a file under .github/workflows/ too — the default GITHUB_TOKEN can never push workflow-file changes. Nothing was pushed. To resolve locally with your own credentials: \`git fetch upstream master && git checkout stock && git merge --ff-only upstream/master && git push\`." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi
