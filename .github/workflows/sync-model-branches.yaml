name: sync RL model combo branches

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: divided-rl-combo
            upstream_ref: divided-rl
          - branch: deep-rl3-combo
            upstream_ref: deep_rl3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch sources
        run: |
          git remote add upstream https://github.com/commaai/openpilot.git
          git fetch upstream ${{ matrix.upstream_ref }}
          git fetch origin combo

      - name: Unshallow submodules
        run: git submodule foreach 'git fetch --unshallow || true'

      - name: Merge own combo branch
        id: merge_combo
        run: |
          if git merge --no-edit origin/combo; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push after combo merge
        if: steps.merge_combo.outputs.result == 'clean'
        id: push_combo
        run: |
          if git push origin ${{ matrix.branch }}; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on combo push failure
        if: steps.push_combo.outputs.result == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] push blocked on ${{ matrix.branch }} — workflow file changed (combo merge)"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Merging combo into **${{ matrix.branch }}** was clean, but GitHub rejected the push because a file under .github/workflows/ changed too — the default GITHUB_TOKEN can never push workflow-file changes. Nothing was pushed. Resolve locally: \`git fetch origin combo && git checkout ${{ matrix.branch }} && git merge origin/combo && git push\`." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi

      - name: Notify on combo conflict
        if: steps.merge_combo.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] combo conflicts on ${{ matrix.branch }} need review"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Automated sync from **combo** hit a merge conflict on **${{ matrix.branch }}**. Nothing was pushed. To resolve locally: \`git fetch origin combo && git checkout ${{ matrix.branch }} && git merge origin/combo\`, fix conflicts, then push." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi

      - name: Merge upstream model branch
        id: merge_upstream
        run: |
          if git merge --no-edit upstream/${{ matrix.upstream_ref }}; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push after upstream merge
        if: steps.merge_upstream.outputs.result == 'clean'
        id: push_upstream
        run: |
          if git push origin ${{ matrix.branch }}; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on upstream push failure
        if: steps.push_upstream.outputs.result == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] push blocked on ${{ matrix.branch }} — workflow file changed (upstream merge)"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Merging commaai/openpilot:${{ matrix.upstream_ref }} into **${{ matrix.branch }}** was clean, but GitHub rejected the push because a file under .github/workflows/ changed too — the default GITHUB_TOKEN can never push workflow-file changes. Nothing was pushed. Resolve locally: \`git fetch upstream ${{ matrix.upstream_ref }} && git checkout ${{ matrix.branch }} && git merge upstream/${{ matrix.upstream_ref }} && git push\`." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi

      - name: Notify on upstream conflict
        if: steps.merge_upstream.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] commaai/openpilot:${{ matrix.upstream_ref }} conflicts on ${{ matrix.branch }} need review"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Automated sync from **commaai/openpilot:${{ matrix.upstream_ref }}** hit a merge conflict on **${{ matrix.branch }}**. Nothing was pushed. To resolve locally: \`git fetch upstream ${{ matrix.upstream_ref }} && git checkout ${{ matrix.branch }} && git merge upstream/${{ matrix.upstream_ref }}\`, fix conflicts, then push." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi
