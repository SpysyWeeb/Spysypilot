name: engagement smoke

on:
  push:
    branches:
      - combo
  pull_request:
  workflow_dispatch:

concurrency:
  group: engagement-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}

jobs:
  engagement-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up openpilot
        run: ./tools/op.sh setup

      - name: Build and check engagement contracts
        run: |
          git fetch https://github.com/commaai/openpilot.git master:refs/remotes/upstream/master
          scons -j$(nproc)
          python -m compileall -q -j 0 openpilot
          python -c "from openpilot.cereal import log"
          pytest -q \
            openpilot/cereal/tests \
            openpilot/selfdrive/locationd/test/test_torqued.py \
            openpilot/selfdrive/car/tests/test_car_interfaces.py \
            openpilot/system/loggerd/tests/test_platform_arch.py \
            openpilot/selfdrive/modeld/tests
          git show upstream/master:openpilot/cereal/log.capnp | grep -oE "^ +[A-Za-z0-9]+ @[0-9]+ :" | sed 's/^ *//' | sort -u > /tmp/up.txt
          grep -oE "^ +[A-Za-z0-9]+ @[0-9]+ :" openpilot/cereal/log.capnp | sed 's/^ *//' | sort -u > /tmp/br.txt
          missing=$(comm -23 /tmp/up.txt /tmp/br.txt | grep -v -e RESERVED -e customReserved || true)
          test -z "$missing"
