name: sync branches with upstream openpilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - swapped-cruise-speed
          - nudgless-lane-changes
          - hot-swap-experimental
          - force-stops
          - error-log-viewer
          - detailed-stats-sidebar
          - better-green-lights
          - better-boot-screen
          - SOL
          - smooth-stops
          - auto-update
          - custom-main-menu
          - side-buttons
          - BLoT
          - driving-event-platform
          - BLaTv2
          - BLaTv3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/commaai/openpilot.git
          git fetch upstream master

      - name: Unshallow submodules
        run: git submodule foreach 'git fetch --unshallow || true'

      - name: Attempt merge
        id: merge
        run: |
          if git merge --no-edit upstream/master; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge
        if: steps.merge.outputs.result == 'clean'
        id: push
        run: |
          if git push origin ${{ matrix.branch }}; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] upstream conflicts on ${{ matrix.branch }} need review"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="Automated sync from commaai/openpilot master hit a merge conflict on **${{ matrix.branch }}**. Nothing was pushed. To resolve locally: \`git fetch upstream master && git checkout ${{ matrix.branch }} && git merge upstream/master\`, fix conflicts, then push." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi

      - name: Notify on push failure
        if: steps.push.outputs.result == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[sync] push blocked on ${{ matrix.branch }} — workflow file changed"
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bot&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="The merge from commaai/openpilot master into **${{ matrix.branch }}** was clean, but GitHub rejected the push because commaai touched a file under .github/workflows/ too — the default GITHUB_TOKEN can never push workflow-file changes, no permission grant fixes it. Nothing was pushed (the merge only happened in this run's disposable checkout). To resolve locally with your own credentials: \`git fetch upstream master && git checkout ${{ matrix.branch }} && git merge upstream/master && git push\`." \
              -f "labels[]=bot"
          else
            echo "Issue #$existing already open, skipping"
          fi
